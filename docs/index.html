<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OSCP Cheatsheet</title>
<link rel="stylesheet" href="style.css?v=20261019201526">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="ナビゲーション">
    <a class="brand" href="#/" title="ホーム">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="brand-text"><small>OSCP</small><strong id="brand-name">oscp.sh</strong></span>
    </a>
    <div class="nav-label">NAVIGATION</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="pill"><i class="dot"></i>READY</span>
      <span class="side-meta" id="side-meta"></span>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <div class="main">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="ナビを開く" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="workspace"><span class="ws-label">WORKSPACE</span><b id="ws-value">/</b></div>
        <button class="vars-summary" id="vars-summary" type="button" title="クリックで変数欄を開く"></button>
        <button class="vars-toggle" id="vars-toggle" type="button" aria-expanded="false">変数</button>
      </div>
      <div class="vars-wrap" id="vars-wrap">
        <div class="vars" id="vars"></div>
        <div class="vars-extra" id="vars-extra" hidden></div>
      </div>
      <div class="topbar-right">
        <button class="qs" id="quick-search" type="button" title="検索 (Ctrl+K)"><span class="k">⌕</span><span>検索</span><kbd>Ctrl K</kbd></button>
        <div class="topbar-btns">
          <button class="btn-ghost" id="vars-more" type="button" aria-expanded="false">その他の変数 ▾</button>
          <button class="btn-ghost" id="vars-clear" type="button">すべてクリア</button>
          <button class="btn-ghost" id="vars-undo" type="button" hidden>元に戻す</button>
        </div>
      </div>
    </header>

    <main class="content" id="content" tabindex="-1"></main>

    <footer class="foot"><span id="foot-left">OSCP.SH</span><span>ENUMERATE // EXPLOIT // ESCALATE</span></footer>
  </div>
</div>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="検索">
  <div class="pal">
    <input id="pal-input" type="text" placeholder="ノート名・検索語・コマンドで探す" autocomplete="off" spellcheck="false" aria-label="検索">
    <ul id="pal-list" class="pal-list" role="listbox"></ul>
    <div class="pal-hint">↑↓ 移動 · Enter 開く · Esc 閉じる</div>
  </div>
</div>

<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script src="data.js?v=20261019201526" charset="utf-8"></script>
<script src="app.js?v=20261019201526" defer></script>
</body>
</html>
